<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portfolio Mockup · 카테고리</title>
    <link rel="stylesheet" href="css/tokens.css" />

  </head>
  <body>
    <div class="app">
      <header class="appbar">
        <span class="appbar__brand">MyService</span>
      </header>

      <main class="content">
        <section class="hero">
          <span class="hero__badge">MOCKUP</span>
          <h1 class="hero__title">UX 목업<br />카테고리</h1>

        <a class="card cat-card" href="showcase.html" aria-labelledby="cat-account-title">

            통합 계정 전환 온보딩 UX. 전환 안내 → 이메일 인증 → 계정 확인·병합 →

          </p>
          <span class="cat-card__go">목업 보기 →</span>

    <script src="js/main.js"></script>
