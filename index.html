<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portfolio Mockup 카테고리</title>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>
  <body>
    <div class="app">
      <header class="appbar">
        <span class="appbar__brand">MyService</span>
      </header>

      <main class="content">
        <section class="hero">
          <span class="hero__badge">MOCKUP</span>
          <h1 class="hero__title">UX 목업<br />카테고리</h1>
          <p class="hero__desc">
            카테고리를 선택해 UX 목업을 확인하세요.
          </p>
        </section>

        <a class="card cat-card" href="dd.html" aria-labelledby="cat-dd-title">
          <div class="card__icon" aria-hidden="true">D</div>
          <h2 id="cat-dd-title" class="card__title">다음 DD 에이전트</h2>
          <p class="card__desc">
            묻지 않아도 먼저 챙기고, 맡기면 대신 하는 실행 에이전트 UX.
            홈 브리핑 → 선톡 알림 → 대화 요약 → 실행·실행취소 → 연동 권한 →
            발송 확인 → 음성 대화 → 루틴 제안 → 작업 목록 흐름을 웹과 앱으로
            동시에 확인합니다.
          </p>
          <span class="cat-card__go">목업 보기 →</span>
        </a>

        <div class="card cat-card cat-card--locked" aria-labelledby="cat-account-title" aria-disabled="true">
          <div class="card__icon" aria-hidden="true">*</div>
          <h2 id="cat-account-title" class="card__title">** 계정 전환</h2>
          <p class="card__desc">
            비공개 처리된 목업입니다. 전환 온보딩 5단계 흐름은 현재 열람이 제한되어 있습니다.
          </p>
          <span class="cat-card__go">🔒 비공개</span>
        </div>

        <p class="helper-text" style="margin-top: var(--sp-6)">
          <a href="components.html">컴포넌트 라이브러리 보기 →</a>
        </p>
      </main>
    </div>
    <script src="js/main.js"></script>
  </body>
</html>
