<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>계정 통합 · Portfolio Mockup</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app">
      <header class="appbar">
        <span class="appbar__brand">MyService</span>
      </header>

      <main class="content">
        <section class="hero">
          <span class="hero__badge">NEW</span>
          <h1 class="hero__title">하나의 계정으로<br />더 편리하게</h1>
          <p class="hero__desc">
            흩어져 있던 계정을 통합 계정 하나로 모아보세요.
          </p>
        </section>

        <section class="card" aria-labelledby="account-block-title">
          <div class="card__icon" aria-hidden="true">🔐</div>
          <h2 id="account-block-title" class="card__title">신규 통합 계정 전환</h2>
          <p class="card__desc">
            기존 계정을 통합 계정으로 전환하면 한 번의 로그인으로 모든 서비스를
            이용할 수 있어요.
          </p>

          <ul class="benefits">
            <li>여러 계정을 하나로 통합 관리</li>
            <li>한 번의 로그인으로 모든 서비스 이용</li>
            <li>강화된 보안과 간편한 인증</li>
          </ul>

          <a class="btn btn--primary btn--block" href="account-transfer.html">
            신규 통합 계정 전환
          </a>
        </section>
      </main>
    </div>
    <script src="js/main.js"></script>
  </body>
</html>
